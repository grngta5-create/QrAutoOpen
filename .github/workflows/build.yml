name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/qrauto
          mkdir -p app/src/main/res
          echo '<manifest package="com.example.qrauto"/>' > app/src/main/AndroidManifest.xml

      - name: Move MainActivity
        run: |
          if [ -f MainActivity.kt ]; then
            mv MainActivity.kt app/src/main/java/com/example/qrauto/MainActivity.kt
          fi

      - name: Create build.gradle
        run: |
          echo "plugins { id 'com.android.application' version '8.1.0' apply false }" > build.gradle
          echo "android { namespace 'com.example.qrauto' compileSdk 34 defaultConfig { applicationId 'com.example.qrauto' minSdk 24 targetSdk 34 versionCd 1 versionName '1.0' } }" > app/build.gradle

      - name: Build APK Placeholder
        run: echo "APK Structure Ready"
