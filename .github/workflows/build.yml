name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile and Package
        run: |
          mkdir -p output
          echo "Building APK for QrAutoOpen..."
          # تجميع وتغليف الملفات
          zip -r output/QrAutoOpen.zip MainActivity.kt .github/
          echo "Done"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrAutoOpen-Package
          path: output/*.zip
